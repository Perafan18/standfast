name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on the release manager's own Mac. Nothing here is rented.
#
# It is the premise of the product applied to the product: these are Pedro's
# Macs, and a build of Standfast has no business renting one from GitHub. It
# also stopped being affordable — GitHub-hosted macOS jobs spent 304 billed
# minutes in August and exhausted the account's Actions budget, which took CI
# down entirely for a day.
#
# What this costs, and it is not only wall-clock:
#
# One runner runs one job at a time, so these three queue behind each other
# instead of starting together. A pass takes longer and costs nothing. On this
# machine each job is also faster than the rented one it replaced, which pays
# some of that back.
#
# And the minimum-OS watchdog is gone. It compiled the package under Xcode 16.2
# on an actual macOS 14, which is the only thing here that ever ran on anything
# but this Mac. **That coverage no longer exists.** It has caught real
# problems — the Swift 6 interoperability failures with `UserNotifications`
# were exactly that class. What survives is compile-time availability:
# `Package.swift` targets `.macOS(.v14)`, so an API newer than the deployment
# target still fails the build. That is not the same as running there, and
# `Resources/Info.plist` still promises macOS 14 to whoever downloads this.
jobs:
  test:
    name: Build and test
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Warnings are treated as errors here rather than in Package.swift so a
      # contributor's local build stays readable while CI stays strict.
      - name: Build (debug, warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      # This intentionally stalls the shared dispatch pool. Keep it isolated
      # from the regular suite so unrelated tests cannot inherit that pressure.
      - name: Watchdog remains independent of the global dispatch pool
        timeout-minutes: 10
        run: bash Tests/Scripts/RunWatchdogRegression.sh

      # Release uses different optimisation and cross-module settings, so a
      # debug-only build genuinely does not cover it.
      - name: Build (release, warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

  package:
    name: Package the app
    runs-on: [self-hosted, macOS, ARM64]
    env:
      # Ad-hoc on purpose, even though this Mac has a Developer ID. The
      # subject of this job is the *fallback* branch — that a build with no
      # certificate still produces a bundle with a real identity, and that
      # `notarize.sh` refuses to send it to Apple. Signing throwaway CI builds
      # with the release certificate would both misuse it and make the next
      # step fail for the reason that the bundle was not ad-hoc after all.
      SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4

      # A release is signed by the release workflow, on this same Mac, with the
      # certificate that never leaves it. What CI covers is the other branch —
      # that the fallback still produces a bundle with a real identity, which is
      # the one the app needs before it can notify at all. See `SIGN_IDENTITY`
      # above for why that branch has to be asked for now.
      - name: Assemble Standfast.app
        run: ./Scripts/build-app.sh

      # The guard that stops an unsigned bundle from being uploaded to Apple.
      # It is the only part of the release path CI can exercise, and the part
      # whose failure is most expensive: without it a release built on a
      # machine whose certificate had expired would be submitted, rejected
      # minutes later, and the reason would have to be dug out of a log.
      - name: The release script refuses to notarise an ad-hoc bundle
        run: |
          if ./Scripts/notarize.sh; then
            echo "::error::notarize.sh accepted a bundle with no Developer ID"
            exit 1
          fi
          echo "refused, as it should"

      - name: Validate Info.plist
        run: |
          plutil -lint .build/Standfast.app/Contents/Info.plist
          # Without LSUIElement the app takes a Dock icon and stops being a
          # menu bar app at all.
          plutil -extract LSUIElement raw .build/Standfast.app/Contents/Info.plist \
            | grep -qx 'true'

      # The only check that catches a bundle which resolves on the machine that
      # built it and traps everywhere else. It reassembles the app, deletes
      # .build on purpose, and launches what is left.
      #
      # Still packaging-only, now for a different reason. It used to be that a
      # GitHub runner cannot grant Accessibility access. This Mac can — but the
      # runner is a launchd agent with no window of its own, and a probe that
      # drove the real menu bar here would fight the copy of Standfast the
      # operator is actually using. Window and menu evidence comes from
      # `./Scripts/check-app.sh` run by hand, and this green step is not it.
      #
      # This is what `make check` runs. The target itself is not used here only
      # because it would repeat the whole test suite the job above just ran.
      - name: Package smoke (menu/windows/AX not covered)
        env:
          STANDFAST_AX_MODE: skip
        run: ./Scripts/check-app.sh

  hygiene:
    name: Hygiene
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strict and skipped AX modes keep distinct contracts
        run: Tests/Scripts/CheckAppAXContractTests.sh

      - name: Packaged localization copies stay identical
        run: Tests/Scripts/CheckLocalizationCataloguesTests.sh

      - name: CI policy contracts stay bounded
        run: Tests/Scripts/CIContractTests.sh

      - name: Public-diff checker handles content, refs, renames, and binaries
        run: Tests/Scripts/PublicDiffContractTests.sh

      - name: Installing over a copy prunes the backups it makes
        run: Tests/Scripts/InstallAppContractTests.sh

      - name: The release rail cannot go green without releasing
        run: Tests/Scripts/ReleaseContractTests.sh

      - name: Every place that names a minimum macOS names the same one
        run: Tests/Scripts/MinimumOSContractTests.sh

      - name: The Dock preference and the gate that checks it agree
        run: Tests/Scripts/DockPreferenceContractTests.sh

      - name: No private workspace references in the PR diff
        if: github.event_name == 'pull_request'
        run: ./Scripts/check-public-diff.sh "origin/${GITHUB_BASE_REF}...HEAD"

      # `swift format`, with a space: the toolchain ships it as a subcommand of
      # `swift`, not as a `swift-format` binary on PATH. It picks up the
      # versioned `.swift-format` by walking up from each file it reads.
      - name: Format
        run: swift format lint --strict --recursive Sources Tests

      # This app used to be hardcoded to one person's machine. The whole point
      # of v0.1 was removing that, and it is exactly the kind of thing a
      # regression reintroduces without anyone noticing.
      #
      # Sources only, and that boundary is deliberate: the tests name
      # `/Users/ci/actions-runner` and a real repository throughout their
      # fixtures, because a LaunchAgent plist has an absolute WorkingDirectory
      # in it and there is nothing to parse without one.
      - name: No machine-specific paths in the source
        run: |
          # `actions-runner-fleet` is a public integration name. The old leak
          # was the local checkout directory `actions-runner/`, which remains
          # forbidden along with absolute user paths and the owner's username.
          private_home='/''Users/'
          if grep -rnE "${private_home}|actions-runner([^-]|$)|Perafan18/" Sources/; then
            echo "::error::Sources must not name a specific machine, user or repository"
            exit 1
          fi

      # Two files carry the release version and nothing in the build links
      # them: CFBundleShortVersionString in the bundle, and the tag inside the
      # formula's url. Bump one, forget the other, and the installed app
      # reports the wrong version to everybody until somebody happens to look.
      - name: The bundle version and the formula agree
        run: |
          bundle="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          formula="$(sed -n 's|.*/tags/v\(.*\)\.tar\.gz.*|\1|p' Formula/standfast.rb)"
          if [ -z "$formula" ]; then
            echo "::error::no version tag found in the url in Formula/standfast.rb"
            exit 1
          fi
          if [ "$bundle" != "$formula" ]; then
            echo "::error::Info.plist says $bundle, Formula/standfast.rb says $formula"
            exit 1
          fi
          echo "both say $bundle"
