# Tag → signed, notarised Standfast.app.
#
# Modelled on nest-rules-app's testflight.yml, which solved the same problem on
# the same Mac. Two differences matter:
#
#   1. That app ships through TestFlight, so it signs with an *Apple
#      Distribution* certificate. Standfast ships through Homebrew and direct
#      download, which Gatekeeper only accepts from a *Developer ID
#      Application* certificate. Same team, same paid membership, different
#      certificate — it has to be generated separately.
#   2. Developer ID needs no provisioning profile, so none of that machinery is
#      here.
#
# ── Required secrets ─────────────────────────────────────────────────────────
# Already set (copied from 1Password, shared with nest-rules-app):
#   ASC_KEY_ID            App Store Connect API key id
#   ASC_ISSUER_ID         issuer id (one per team)
#   ASC_KEY_P8_BASE64     base64 of AuthKey_XXXX.p8
# Still missing — the whole reason this job self-skips today:
#   DEVELOPER_ID_P12_BASE64    base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD  password for that .p12
#   KEYCHAIN_PASSWORD          any strong string; names a throwaway keychain
#
# Until the three are set the job self-skips green, so tagging never produces a
# red check.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The job mutates machine-wide state on the runner host (the keychain search
# list), so two of them overlapping on the same Mac would fight over it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Self-hosted, on the Mac that already has the toolchain warm. NOTE: the
    # runner currently registered on that Mac belongs to nest-rules-app, so
    # this repository needs its own — a Mac can host several.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Are the signing secrets configured?
        id: gate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::notice::No Developer ID certificate configured — skipping. See the header of this file."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.gate.outputs.configured == 'true'
        run: swift test

      - name: Import the Developer ID certificate
        if: steps.gate.outputs.configured == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN="$RUNNER_TEMP/standfast-signing.keychain-db"

          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$CERT"

          # `list-keychains -s` REPLACES the search list rather than adding to
          # it. On a throwaway VM that is harmless; on this persistent Mac it
          # would evict the operator's login keychain for good, and every later
          # credential lookup on the machine — inside CI or not — would stop
          # finding it. Record the original list and prepend; cleanup restores
          # it even when the build fails.
          ORIGINAL="$RUNNER_TEMP/keychains.orig"
          security list-keychains -d user | sed 's/^[[:space:]]*"//;s/"$//' > "$ORIGINAL"
          echo "ORIGINAL_KEYCHAINS_FILE=$ORIGINAL" >> "$GITHUB_ENV"

          KEYCHAINS=()
          while IFS= read -r k; do [ -n "$k" ] && KEYCHAINS+=("$k"); done < "$ORIGINAL"
          security list-keychains -d user -s "$KEYCHAIN" "${KEYCHAINS[@]}"

      - name: Build and sign
        if: steps.gate.outputs.configured == 'true'
        run: ./Scripts/build-app.sh

      - name: Notarise and staple
        if: steps.gate.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          NOTARY_KEY="$KEY" NOTARY_KEY_ID="$ASC_KEY_ID" \
            NOTARY_ISSUER="$ASC_ISSUER_ID" ./Scripts/notarize.sh

      - name: Prove it would open on somebody else's Mac
        if: steps.gate.outputs.configured == 'true'
        run: |
          APP=.build/Standfast.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The check that matters: Gatekeeper's own verdict. A signed but
          # un-notarised build passes codesign and is still refused on every
          # Mac but this one.
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"

      - name: Attach the app to the release
        if: steps.gate.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --keepParent .build/Standfast.app "$RUNNER_TEMP/Standfast.zip"
          gh release upload "$TAG" "$RUNNER_TEMP/Standfast.zip" --clobber
        # GITHUB_TOKEN is scoped to this repository and expires with the job.
        # It is never written anywhere.

      - name: Put the machine back as it was
        if: always()
        run: |
          if [ -n "${ORIGINAL_KEYCHAINS_FILE:-}" ] && [ -f "$ORIGINAL_KEYCHAINS_FILE" ]; then
            KEYCHAINS=()
            while IFS= read -r k; do [ -n "$k" ] && KEYCHAINS+=("$k"); done \
              < "$ORIGINAL_KEYCHAINS_FILE"
            if [ "${#KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${KEYCHAINS[@]}" || true
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/standfast-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/developer_id.p12" || true
