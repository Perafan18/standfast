# Tag → signed, notarised Standfast.app.
#
# Modelled on nest-rules-app's testflight.yml, which solved the same problem on
# the same Mac. Two differences matter:
#
#   1. That app ships through TestFlight, so it signs with an *Apple
#      Distribution* certificate. Standfast ships through Homebrew and direct
#      download, which Gatekeeper only accepts from a *Developer ID
#      Application* certificate. Same team, same paid membership, different
#      certificate — it has to be generated separately.
#   2. Developer ID needs no provisioning profile, so none of that machinery is
#      here.
#
# ── Required secrets ─────────────────────────────────────────────────────────
# Already set (copied from 1Password, shared with nest-rules-app):
#   ASC_KEY_ID            App Store Connect API key id
#   ASC_ISSUER_ID         issuer id (one per team)
#   ASC_KEY_P8_BASE64     base64 of AuthKey_XXXX.p8
# Still missing — the whole reason this job self-skips today:
#   DEVELOPER_ID_P12_BASE64    base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD  password for that .p12
#   KEYCHAIN_PASSWORD          any strong string; names a throwaway keychain
#
# What happens when they are missing depends on why the job is running, and the
# two cases are not the same thing:
#
#   * A **manual run** is the smoke test for this rail. It self-skips green,
#     because anybody may run it and a red check for "not configured yet" is
#     noise.
#   * A **tag** is a publication. It **fails**. A tag that skips green produces
#     a check saying the release succeeded and a repository with no artifact in
#     it, which is the shape of a failure nobody notices until somebody tries to
#     download it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The job mutates machine-wide state on the runner host (the keychain search
# list), so two of them overlapping on the same Mac would fight over it.
#
# A constant group, deliberately not keyed on the ref. Keying on the ref
# serialises runs of the *same* tag and lets everything else through — two tags,
# or a tag and a manual run — which are exactly the pairs that would rewrite the
# host keychain at the same time.
#
# What this still cannot do: another repository's release job on the same Mac.
# GitHub concurrency is per repository, and there is no cross-repository lock.
# The `security list-keychains` dance below restores what it found rather than
# assuming, which is the mitigation available at that level.
concurrency:
  group: standfast-release-signing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Self-hosted, on the Mac that already has the toolchain warm. NOTE: the
    # runner currently registered on that Mac belongs to nest-rules-app, so
    # this repository needs its own — a Mac can host several.
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v4

      # A tag pushed before the version bump would sign, notarise and publish
      # an app that reports the previous version. Before the gate, so the
      # mismatch fails before anything touches the host keychain.
      - name: The tag names the version the app reports
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Info.plist says $version"
            exit 1
          fi
          echo "tag and Info.plist both say $version"

      - name: Are the signing secrets configured?
        id: gate
        env:
          # Every secret any later step consumes, named exactly as it is named
          # in repository settings so the failure below can be acted on without
          # opening this file. Checking only the signing three meant a run could
          # pass this gate and die at notarisation — after the certificate was
          # already imported into the host's keychain.
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD \
            KEYCHAIN_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            # `:-` because a secret that is not set arrives as an empty
            # string here, but a shell that runs this with `set -u` — a future
            # runner default, or anybody testing the logic by hand — would
            # abort on the unset case instead of reporting it.
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag is somebody publishing. Green-and-empty is worse than red
          # here: it is a check that says the release worked, over a release
          # that does not exist.
          case "$GITHUB_REF" in
            refs/tags/*)
              echo "::error::Cannot release $GITHUB_REF: ${missing[*]} not set in repository secrets."
              exit 1
              ;;
          esac

          echo "::notice::Skipping — not configured yet: ${missing[*]}. See the header of this file."
          echo "configured=false" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.gate.outputs.configured == 'true'
        run: swift test

      - name: Import the Developer ID certificate
        if: steps.gate.outputs.configured == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN="$RUNNER_TEMP/standfast-signing.keychain-db"

          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$CERT"

          # `list-keychains -s` REPLACES the search list rather than adding to
          # it. On a throwaway VM that is harmless; on this persistent Mac it
          # would evict the operator's login keychain for good, and every later
          # credential lookup on the machine — inside CI or not — would stop
          # finding it. Record the original list and prepend; cleanup restores
          # it even when the build fails.
          ORIGINAL="$RUNNER_TEMP/keychains.orig"
          security list-keychains -d user | sed 's/^[[:space:]]*"//;s/"$//' > "$ORIGINAL"
          echo "ORIGINAL_KEYCHAINS_FILE=$ORIGINAL" >> "$GITHUB_ENV"

          KEYCHAINS=()
          while IFS= read -r k; do [ -n "$k" ] && KEYCHAINS+=("$k"); done < "$ORIGINAL"
          security list-keychains -d user -s "$KEYCHAIN" "${KEYCHAINS[@]}"

      - name: Build and sign
        if: steps.gate.outputs.configured == 'true'
        env:
          # This runner is Apple silicon, and the download has to open on any
          # Mac that meets the macOS 14 requirement, Intel ones included.
          ARCHS: arm64 x86_64
        run: ./Scripts/build-app.sh

      # Before notarising, because a thin executable notarises and staples
      # just as happily and is then refused on the other kind of Mac.
      - name: Both architectures are in the executable
        if: steps.gate.outputs.configured == 'true'
        run: |
          archs="$(lipo -archs .build/Standfast.app/Contents/MacOS/Standfast)"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *)
                echo "::error::the executable has no $arch slice (has: $archs)"
                exit 1
                ;;
            esac
          done
          echo "universal: $archs"

      - name: Notarise and staple
        if: steps.gate.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          NOTARY_KEY="$KEY" NOTARY_KEY_ID="$ASC_KEY_ID" \
            NOTARY_ISSUER="$ASC_ISSUER_ID" ./Scripts/notarize.sh

      - name: Prove it would open on somebody else's Mac
        if: steps.gate.outputs.configured == 'true'
        run: |
          APP=.build/Standfast.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The check that matters: Gatekeeper's own verdict. A signed but
          # un-notarised build passes codesign and is still refused on every
          # Mac but this one.
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"

      - name: Package the signed app
        if: steps.gate.outputs.configured == 'true'
        run: ditto -c -k --keepParent .build/Standfast.app "$RUNNER_TEMP/Standfast.zip"

      - name: Keep it, so a manual run leaves something to look at
        if: steps.gate.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          # A manual run is this rail's smoke test. One that signs, notarises,
          # staples, and then deletes the result proves the steps executed and
          # leaves nothing anybody can open — which is most of the value of a
          # smoke test.
          name: Standfast-${{ github.sha }}
          path: ${{ runner.temp }}/Standfast.zip
          if-no-files-found: error

      - name: Attach the app to the release
        if: steps.gate.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          # `gh` reads this. Without it the step fails on authentication — at
          # the very end, after signing and notarising have already happened.
          # GITHUB_TOKEN is scoped to this repository, expires with the job, and
          # is never written anywhere.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Pushing a tag does not create a GitHub Release. `gh release upload`
          # against one that does not exist fails, and it failed here — as the
          # last step of a job that had already done all the expensive work.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/Standfast.zip" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/Standfast.zip" \
              --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Put the machine back as it was
        if: always()
        run: |
          if [ -n "${ORIGINAL_KEYCHAINS_FILE:-}" ] && [ -f "$ORIGINAL_KEYCHAINS_FILE" ]; then
            KEYCHAINS=()
            while IFS= read -r k; do [ -n "$k" ] && KEYCHAINS+=("$k"); done \
              < "$ORIGINAL_KEYCHAINS_FILE"
            if [ "${#KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${KEYCHAINS[@]}" || true
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/standfast-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/developer_id.p12" || true
